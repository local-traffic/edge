[project]
name = "car-statistics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "boxmot>=15.0.10",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "numpy>=2.3.5",
    "psycopg2-binary>=2.9.11",
    "pyinfra>=3.6",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rfdetr>=1.3.0",
    "roboflow>=1.2.11",
    "shapely>=2.1.2",
    "supervision>=0.27.0,<0.31",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "ultralytics>=8.3.235",
]


[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real videos through the detection pipeline (deselect with -m \"not slow\")"]
python_files = "test_*.py"

[tool.uv]
python-preference = "system"
